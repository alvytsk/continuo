[package]
name = "continuo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac"] }
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.0"
crossbeam-channel = "0.5.17"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
http = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
