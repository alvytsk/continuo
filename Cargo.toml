[package]
name = "continuo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
