name: Release rehearsal

# Publishing is done by hand: `cargo publish --locked` from a clean checkout
# of main with a maintainer's own token (docs/architecture.md, section 11).
# This workflow only rehearses it on demand. The tag-triggered Trusted
# Publishing path it started as was never configured on crates.io; if that
# changes, the version at 2167690 has the full tag-verify-and-publish job.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rehearse:
    name: Test and publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked --no-fail-fast

      - run: cargo publish --dry-run --locked
